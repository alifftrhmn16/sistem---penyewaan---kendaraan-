<!DOCTYPE html>
<html>
<head>
    <title>Form Penyewaan</title>
</head>

<body>

    <h1>Form Penyewaan Kendaraan</h1>

    <form>

        <p>Nama Penyewa</p>
        <input type="text" placeholder="Masukkan nama">

        <p>Pilih Kendaraan</p>
        <select>
            <option>Toyota Avanza</option>
            <option>Honda Brio</option>
        </select>

        <p>Tanggal Sewa</p>
        <input type="date">

        <p>Lama Sewa</p>
        <input type="number" placeholder="Jumlah hari">

        <br><br>

        <button type="submit">
            Sewa Sekarang
        </button>

    </form>

</body>
</html>
